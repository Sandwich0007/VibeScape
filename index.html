<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="utility.css" />
    <title>VibeScape - Enter Your Sound World</title>
  </head>
  <body>
    <div class="container black flex">
      <aside class="left">
        <div class="close">
          <img width="30" class="invert" src="image/close.svg" />
        </div>
        <div class="home grey m1 r1 p1">
          <div class="logo">
            <img width="130" src="image/logo.svg" alt="logo" />
          </div>
          <ul>
            <li><img class="invert" src="image/home.svg" alt="home" />Home</li>
            <li>
              <img class="invert" src="image/search.svg" alt="search" />Search
            </li>
          </ul>
        </div>
        <div class="library grey r1 m1 p1">
          <div class="heading">
            <img class="invert" src="image/playlist.svg" alt="playlist" />
            <h2>your library</h2>
          </div>
          <div class="songlist">
            <ul>
              <li>
                <img class="invert" src="image/music.svg" />
                <div class="info">
                  <div>Song Name</div>
                  <div>Song Artist</div>
                </div>
                <div class="playnow">
                  <span>Play Now</span>
                  <img class="invert" src="image/play.svg" alt="" />
                </div>
              </li>
            </ul>
          </div>
          <footer class="footer">
            <div>
              <a href="https://www.VibeScape.com/jp/legal/"
                ><span>Legal</span></a
              >
            </div>
            <div>
              <a href="https://www.VibeScape.com/jp/privacy/"
                ><span>Privacy Center</span></a
              >
            </div>
            <div>
              <a href="https://www.VibeScape.com/jp/legal/privacy-policy/"
                ><span>Privacy Policy</span></a
              >
            </div>
            <div>
              <a href="https://www.VibeScape.com/jp/legal/cookies-policy/"
                ><span>Cookies</span></a
              >
            </div>
            <div>
              <a href="https://www.VibeScape.com/jp/legal/privacy-policy/#s3"
                ><span>About Ads</span></a
              >
            </div>
            <div>
              <a href="https://www.VibeScape.com/jp/accessibility/"
                ><span>Accessibility</span></a
              >
            </div>
          </footer>
        </div>
      </aside>

      <main class="right background grey r1">
        <header class="header">
          <nav class="nav">
            <div class="hamburgerContainer">
              <img
                class="invert hamburger"
                width="40px"
                src="image/hamburger.svg"
              />
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                  stroke="#ffffff"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                  stroke="#ffffff"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </nav>
          <div class="buttons">
            <button class="signupbtn">Sign Up</button>
            <button class="loginbtn">Log In</button>
          </div>
        </header>
        <section class="VibeScapePlaylist">
          <h1>VibeScape Playlist</h1>
          <div class="cardcontainer"></div>
        </section>
        <div class="playbar">
          <div class="seekbar">
            <div class="circle"></div>
          </div>
          <div class="abovebar">
            <div class="songinfo"></div>
            <div class="songbuttons">
  <img width="35px" id="previous" src="image/prevsong.svg" alt="Previous track" role="button" tabindex="0" />
  <img width="35px" id="play" src="image/play.svg" alt="Play or pause" role="button" tabindex="0" />
  <img width="35px" id="next" src="image/nextsong.svg" alt="Next track" role="button" tabindex="0" />
</div>
            <div class="timevol">
              <div class="songtime"></div>
              <div class="volume">
                <img src="image/volume.svg" alt="" />
                <div class="range">
                  <input
                    type="range"
                    name="volume"
                    id="volumeRange"
                    min="0"
                    max="100"
                    value="100"
                    aria-label="Volume Control"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
